kind = "web"
previewPath = "/"
title = "ATOMIC FLIX - Privacy Policy"
version = "1.0.0"
id = "artifacts/atomic-flix-privacy"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24997

[services.development]
run = "pnpm --filter @workspace/atomic-flix-privacy run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/atomic-flix-privacy", "run", "build" ]
publicDir = "artifacts/atomic-flix-privacy/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24997"
BASE_PATH = "/"
